<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 360 280"
     role="img"
     aria-label="Stylised loss landscape with a gradient-descent trajectory.">
  <defs>
    <radialGradient id="kbHeroHalo" cx="62%" cy="55%" r="48%">
      <stop offset="0%" stop-color="#6B3FA0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6B3FA0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="360" height="280" fill="url(#kbHeroHalo)"/>

  <!-- Concentric deformed ellipses suggesting contour lines of a loss surface.
       Centre is slightly offset so the descent path reads naturally. -->
  <g fill="none" stroke="#6B3FA0" stroke-linecap="round">
    <ellipse cx="225" cy="150" rx="128" ry="86" transform="rotate(-14 225 150)" stroke-opacity="0.15" stroke-width="1.2"/>
    <ellipse cx="225" cy="150" rx="104" ry="68" transform="rotate(-14 225 150)" stroke-opacity="0.22" stroke-width="1.2"/>
    <ellipse cx="225" cy="150" rx="82"  ry="52" transform="rotate(-14 225 150)" stroke-opacity="0.30" stroke-width="1.2"/>
    <ellipse cx="225" cy="150" rx="60"  ry="37" transform="rotate(-14 225 150)" stroke-opacity="0.40" stroke-width="1.2"/>
    <ellipse cx="225" cy="150" rx="40"  ry="24" transform="rotate(-14 225 150)" stroke-opacity="0.55" stroke-width="1.3"/>
    <ellipse cx="225" cy="150" rx="22"  ry="13" transform="rotate(-14 225 150)" stroke-opacity="0.75" stroke-width="1.4"/>
  </g>

  <!-- Descent trajectory: a polyline with decreasing step sizes, like momentum-GD -->
  <polyline points="38,52 78,96 118,118 160,135 192,146 212,148 224,150"
            fill="none"
            stroke="#6B3FA0"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-dasharray="0 0"/>

  <!-- Iterate dots -->
  <g fill="#6B3FA0">
    <circle cx="38"  cy="52"  r="3.2" fill-opacity="0.35"/>
    <circle cx="78"  cy="96"  r="3.2" fill-opacity="0.50"/>
    <circle cx="118" cy="118" r="3.2" fill-opacity="0.65"/>
    <circle cx="160" cy="135" r="3.2" fill-opacity="0.80"/>
    <circle cx="192" cy="146" r="3.2" fill-opacity="0.90"/>
    <circle cx="212" cy="148" r="3.2"/>
  </g>
  <!-- Final marker at the minimum -->
  <circle cx="224" cy="150" r="5" fill="#ffffff" stroke="#6B3FA0" stroke-width="2.5"/>
</svg>
